name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux:
    name: Build Linux AppImage
    runs-on: ubuntu-22.04
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag
        run: npm run verify:release

      - name: Check JavaScript syntax
        run: npm run check

      - name: Build AppImage
        run: npm run dist:linux

      - name: Create checksum
        shell: bash
        run: |
          cd dist
          sha256sum Codex-Traffic-Studio-*.AppImage > SHA256SUMS-linux.txt

      - name: Upload Linux release files
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/Codex-Traffic-Studio-*.AppImage
            dist/SHA256SUMS-linux.txt

  windows:
    name: Build Windows portable EXE
    runs-on: windows-2022
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag
        run: npm run verify:release

      - name: Check JavaScript syntax
        run: npm run check

      - name: Build portable EXE
        run: npm run dist:win

      - name: Create checksum
        shell: pwsh
        run: |
          $file = Get-ChildItem dist/Codex-Traffic-Studio-*.exe | Select-Object -First 1
          $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($file.Name)" | Set-Content dist/SHA256SUMS-windows.txt

      - name: Upload Windows release files
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/Codex-Traffic-Studio-*.exe
            dist/SHA256SUMS-windows.txt

  macos:
    name: Build macOS (${{ matrix.arch }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    env:
      # 公开构建默认不包含 Apple Developer 证书，避免 electron-builder 尝试自动发现签名身份。
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag
        run: npm run verify:release

      - name: Check JavaScript syntax
        run: npm run check

      - name: Build macOS package
        run: npm run dist:mac -- --${{ matrix.arch }}

      - name: Create checksum
        shell: bash
        run: |
          cd dist
          shasum -a 256 Codex-Traffic-Studio-*-${{ matrix.arch }}.dmg Codex-Traffic-Studio-*-${{ matrix.arch }}.zip > SHA256SUMS-macos-${{ matrix.arch }}.txt

      - name: Upload macOS release files
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/Codex-Traffic-Studio-*-${{ matrix.arch }}.dmg
            dist/Codex-Traffic-Studio-*-${{ matrix.arch }}.zip
            dist/SHA256SUMS-macos-${{ matrix.arch }}.txt
