name: Bug 报告
description: 报告可以稳定复现的问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请勿上传真实 `.codex` 日志、访问令牌、API 密钥或未脱敏截图。

  - type: input
    id: version
    attributes:
      label: 应用版本
      placeholder: 例如 2.1.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows 10
        - Windows 11
        - Linux
        - 其他
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 说明实际结果与预期结果。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true

  - type: textarea
    id: sanitized_logs
    attributes:
      label: 脱敏日志
      description: 可选。请删除项目路径、令牌、账号信息和会话内容。
